---
version: '3'
tasks:
  install:
    desc: 🧱 Install React dependencies
    cmds:
      # `dr run dev` starts this service and fastapi_server (whose dev task runs `task build`
      # here) together, so two of these can run at once. On an empty node_modules they
      # collide with ENOTEMPTY and the whole stack exits. Take turns where flock exists
      # (Linux, codespaces); the second install then finds nothing left to do.
      - |
        if command -v flock >/dev/null 2>&1; then
          flock .npm-install.lock npm install --loglevel=error
        else
          npm install --loglevel=error
        fi
  lint:
    desc: 🧹 Lint React code
    cmds:
      - npm run lint:fix
  lint-check:
    desc: 🧹 Lint React code
    cmds:
      - npm run lint
  test:
    desc: 🧪 Test React code
    cmds:
      - npm run test
  test-watch:
    desc: 🧪👀 Continuously Test React code
    cmds:
      - npm run test:watch
  build:
    desc: 🏗️ Build React code
    deps: [install]
    cmds:
      - npm run build
  dev:
    desc: 🚀 Start React development server
    deps: [install]
    cmds:
      - npm run dev
